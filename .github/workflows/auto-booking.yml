name: Auto-booking

on:
  # Триггер по расписанию GitHub Actions (`schedule:`) сюда намеренно не
  # добавлен: по документации GitHub он может задерживаться (особенно в
  # начале каждого часа) или вовсе не сработать при высокой нагрузке, без
  # каких-либо гарантий по времени. На практике задержка доходила до 80+
  # минут, из-за чего запись уходила намного позже открытия и не успевала.
  #
  # Вместо этого job запускает внешний точный cron-сервис (например,
  # cron-job.org), который каждый Пн/Ср/Пт/Сб в 08:58 Europe/Minsk (05:58
  # UTC) шлёт POST на GitHub API:
  #   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/auto-booking.yml/dispatches
  #   Authorization: Bearer <fine-grained PAT, только Actions: Read and write>
  #   Accept: application/vnd.github+json
  #   Body: {"ref":"main"}
  # Сам скрипт всё равно досыпает до точного 09:00 МСК (nineAmMinskUtc в
  # auto-booking.mjs), так что небольшая погрешность внешнего сервиса не
  # страшна — это лишь запасной 2-минутный буфер перед открытием записи.
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run auto-booking
        env:
          MOBIFIT_TOKEN: ${{ secrets.MOBIFIT_TOKEN }}
        run: node automation/auto-booking.mjs
